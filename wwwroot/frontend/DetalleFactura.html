
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Facturas - Inmobiliaria Córdoba</title>
    <link rel="stylesheet" href="css/Estilos.css">
</head>

<body>

    <header>
        <h1>Inmobiliaria Córdoba</h1>

        <nav>
            <a href="Indice.html">Inicio</a>
            <a href="Indice.html#propiedades">Propiedades</a>
            <a href="DetalleFactura.html">Facturación</a>
            <a href="Login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <section class="gestion-facturas">

            <h2>Gestión de detalles de facturas</h2>
            <p>Administrá los conceptos asociados a las facturas.</p>

            <form id="formulario-detalle">

                <input type="hidden" id="id-detalle">

                <div class="campos-factura">

                    <div>
                        <label for="id-factura">Factura</label>
                        <select id="id-factura" required>
                            <option value="">Seleccionar factura</option>
                        </select>
                    </div>

                    <div>
                        <label for="concepto">Concepto</label>
                        <input type="text"
                               id="concepto"
                               maxlength="200"
                               placeholder="Ej: Comisión inmobiliaria"
                               required>
                    </div>

                    <div>
                        <label for="cantidad">Cantidad</label>
                        <input type="number"
                               id="cantidad"
                               min="1"
                               value="1"
                               required>
                    </div>

                    <div>
                        <label for="precio-unitario">Precio unitario</label>
                        <input type="number"
                               id="precio-unitario"
                               min="0"
                               step="0.01"
                               required>
                    </div>

                </div>

                <p class="subtotal-factura">
                    Subtotal:
                    <strong id="subtotal">$0,00</strong>
                </p>

                <button type="submit" id="guardar-detalle">
                    Guardar detalle
                </button>

                <button type="button" id="cancelar-edicion">
                    Cancelar edición
                </button>

                <p id="mensaje-detalle" role="status"
                   aria-live="polite"></p>

            </form>

            <h3>Detalles registrados</h3>

            <div class="tabla-facturas">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Factura</th>
                            <th>Concepto</th>
                            <th>Cantidad</th>
                            <th>Precio unitario</th>
                            <th>Subtotal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tabla-detalles">
                    </tbody>
                </table>
            </div>

        </section>
    </main>

    <footer>
        <p>Inmobiliaria Córdoba</p>
    </footer>

    <script src="js/detalleFactura.js"></script>

</body>
</html>
