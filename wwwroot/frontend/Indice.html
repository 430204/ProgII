<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inmobiliaria Córdoba</title>

    <link rel="stylesheet" href="css/Estilos.css">
</head>
<body>

    <header>
        <h1>Inmobiliaria Córdoba</h1>

        <nav>
            <a href="Indice.html">Inicio</a>
            <a href="#propiedades">Propiedades</a>
            <a href="Contacto.html">Contacto</a>
            <a href="Login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <section class="portada">
            <div class="contenido-portada">
                <h2>Encontrá tu próxima propiedad</h2>
                <p>Descubrí casas, departamentos y terrenos en Córdoba.</p>

                <form class="buscador" id="formulario-busqueda">
                    <div>
                        <label for="texto-busqueda">Buscar por texto</label>
                        <input type="text"
                               id="texto-busqueda"
                               placeholder="Título, ciudad o tipo">
                    </div>

                    <div>
                        <label for="operacion">Operación</label>
                        <select id="operacion">
                            <option value="">Todas</option>
                            <option value="Venta">Venta</option>
                            <option value="Alquiler">Alquiler</option>
                        </select>
                    </div>

                    <div>
                        <label for="moneda">Moneda</label>
                        <select id="moneda">
                            <option value="">Todas</option>
                            <option value="ARS">Pesos argentinos</option>
                            <option value="USD">Dólares</option>
                        </select>
                    </div>

                    <div>
                        <label for="precio-maximo">Precio máximo</label>
                        <input type="number"
                               id="precio-maximo"
                               min="0.01"
                               step="0.01"
                               placeholder="Sin límite">
                    </div>

                    <button type="submit">Buscar propiedades</button>
                </form>
            </div>
        </section>

        <section id="propiedades">
            <h2>Propiedades disponibles</h2>

            <div id="lista-inmuebles" class="contenedor-propiedades"></div>

            <h3>Resultados de la búsqueda</h3>
            <p id="cantidad-resultados" aria-live="polite"></p>

            <div class="contenedor-tabla">
                <table class="tabla-resultados">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Propiedad</th>
                            <th>Tipo</th>
                            <th>Ciudad</th>
                            <th>Operación</th>
                            <th>Moneda</th>
                            <th>Precio</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-resultados"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Inmobiliaria Córdoba</p>
    </footer>

    <script src="js/Propiedades.js"></script>
</body>
</html>
